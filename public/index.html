<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Чат для Своих</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        :root {
            --bg: #ffffff;
            --sidebar: #f5f5f8;
            --chat-bg: #ffffff;
            --msg-mine: #e94560;
            --msg-friend: #f0f0f5;
            --accent: #e94560;
            --accent2: #00d4ff;
            --text: #1a1a2e;
            --text-secondary: #8888aa;
            --border: rgba(0,0,0,0.08);
            --input-bg: #f5f5f8;
            --glass: rgba(255,255,255,0.8);
            --nav-bg: #ffffff;
            --shadow: 0 2px 20px rgba(0,0,0,0.08);
        }
        .dark {
            --bg: #0a0a1a;
            --sidebar: #0f0f24;
            --chat-bg: #0d0d20;
            --msg-mine: #e94560;
            --msg-friend: rgba(255,255,255,0.05);
            --text: #e8e8f0;
            --text-secondary: #8888aa;
            --border: rgba(255,255,255,0.06);
            --input-bg: rgba(255,255,255,0.04);
            --glass: rgba(15,15,36,0.8);
            --nav-bg: #0f0f24;
            --shadow: 0 2px 20px rgba(0,0,0,0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh; height: 100dvh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; transition: background 0.3s, color 0.3s;
        }
        /* === ЛОГИН === */
        .login-screen {
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border); padding: 40px 35px;
            border-radius: 28px; text-align: center; box-shadow: var(--shadow);
            width: 340px; max-width: 90vw;
        }
        .login-screen .logo { font-size: 60px; margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
        .login-screen h1 { font-size: 1.6em; font-weight: 700; margin-bottom: 5px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .login-screen .subtitle { color: var(--text-secondary); font-size: 0.85em; margin-bottom: 20px; }
        .login-screen input {
            display: block; width: 100%; padding: 14px 18px; margin: 8px 0;
            border-radius: 30px; border: 1px solid var(--border);
            background: var(--input-bg); color: var(--text); font-size: 1em;
            text-align: center; outline: none; transition: all 0.3s;
        }
        .login-screen input:focus { border-color: var(--accent); }
        .login-screen button {
            width: 100%; padding: 14px; margin-top: 10px;
            border-radius: 30px; border: none;
            background: linear-gradient(135deg, var(--accent), #c23152);
            color: white; font-weight: bold; font-size: 1.1em;
            cursor: pointer; transition: all 0.3s;
        }
        .login-screen button:active { transform: scale(0.97); }
        .login-screen .avatar-pick { display: flex; gap: 6px; justify-content: center; margin: 12px 0; flex-wrap: wrap; }
        .login-screen .avatar-pick span { font-size: 1.8em; cursor: pointer; padding: 4px; border-radius: 50%; transition: all 0.2s; }
        .login-screen .avatar-pick span.selected { background: rgba(233,69,96,0.2); outline: 2px solid var(--accent); }

        /* === ОСНОВНОЙ ЭКРАН === */
        .app { display: none; width: 100%; height: 100%; max-width: 1200px; flex-direction: column; }
        .app.active { display: flex; }
/* === ВЕРХНЯЯ ПАНЕЛЬ === */
        .topbar {
            display: flex; align-items: center; padding: 12px 20px;
            background: var(--nav-bg); border-bottom: 1px solid var(--border);
            gap: 12px; z-index: 10;
        }
        .topbar .room-title { font-weight: bold; font-size: 1.1em; flex-grow: 1; }
        .topbar button {
            padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border);
            background: var(--input-bg); color: var(--text); cursor: pointer;
            font-size: 0.9em; transition: all 0.2s;
        }
        .topbar button:active { transform: scale(0.95); }
        .theme-btn { font-size: 1.3em !important; padding: 6px 10px !important; }

        /* === КОНТЕНТ === */
        .content { flex-grow: 1; display: flex; overflow: hidden; }

        /* === САЙДБАР === */
        .sidebar {
            width: 260px; background: var(--sidebar); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 15px 12px;
            overflow-y: auto; transition: transform 0.3s;
        }
        .sidebar h3 {
            font-size: 0.7em; text-transform: uppercase; letter-spacing: 2px;
            color: var(--text-secondary); margin-bottom: 10px; padding: 0 8px;
        }
        .user-list { list-style: none; }
        .user-list li {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 14px; margin-bottom: 3px;
            font-size: 0.9em; cursor: pointer; transition: background 0.2s;
            animation: fadeSlide 0.3s ease;
        }
        @keyframes fadeSlide { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .user-list li:hover { background: rgba(128,128,128,0.1); }
        .user-list li.active { background: rgba(233,69,96,0.15); font-weight: bold; }
        .avatar { font-size: 1.3em; }
        .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; margin-left: auto; box-shadow: 0 0 8px #00ff8866; }
        .settings-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-size: 0.9em; }

        /* === ЧАТ === */
        .chat-area { flex-grow: 1; display: flex; flex-direction: column; background: var(--chat-bg); }
        .messages { flex-grow: 1; overflow-y: auto; padding: 15px 20px; display: flex; flex-direction: column; gap: 3px; }
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        .msg {
            max-width: 75%; padding: 8px 14px; border-radius: 18px;
            line-height: 1.45; font-size: 0.93em; word-wrap: break-word;
            animation: msgIn 0.25s ease; position: relative; cursor: default;
        }
        @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg.mine { background: var(--msg-mine); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.friend { background: var(--msg-friend); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }
        .msg.system { align-self: center; background: transparent; color: var(--text-secondary); font-size: 0.75em; padding: 4px 12px; }
        .msg-header { font-size: 0.7em; margin-bottom: 2px; opacity: 0.8; display: flex; align-items: center; gap: 4px; }
        .msg-time { font-size: 0.65em; opacity: 0.6; margin-left: 6px; }
        .msg img { max-width: 100%; max-height: 250px; border-radius: 10px; margin-top: 4px; cursor: pointer; }
        .msg audio { max-width: 200px; height: 36px; margin-top: 4px; }
        .msg .reactions {
            display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap;
        }
        .msg .reaction {
            background: rgba(128,128,128,0.15); padding: 2px 7px;
            border-radius: 12px; font-size: 0.75em; cursor: pointer;
            display: flex; align-items: center; gap: 3px;
        }
        .msg .reaction.active { background: rgba(233,69,96,0.2); }

        /* Ввод */
        .input-area {
            display: flex; padding: 12px 15px; border-top: 1px solid var(--border);
            background: var(--nav-bg); gap: 8px; align-items: center;
        }
        .input-area input {
            flex-grow: 1; padding: 12px 16px; border-radius: 25px;
            border: 1px solid var(--border); background: var(--input-bg);
            color: var(--text); font-size: 0.95em; outline: none;
        }
        .input-area button {
            padding: 10px 18px; border-radius: 25px; border: none;
            background: var(--accent); color: white; font-weight: bold;
            cursor: pointer; font-size: 1em; white-space: nowrap;
        }
        .input-area button:active { transform: scale(0.95); }
        .icon-btn {
            background: var(--input-bg) !important; color: var(--text) !important;
            border: 1px solid var(--border) !important; font-size: 1.2em !important;
            padding: 10px 14px !important;
        }

        /* Реакции попап */
        .reaction-popup {
            display: none; position: fixed; background: var(--sidebar);
            border: 1px solid var(--border); border-radius: 20px;
            padding: 8px 12px; gap: 8px; z-index: 999;
            box-shadow: var(--shadow); flex-wrap: wrap;
        }
        .reaction-popup.show { display: flex; }
        .reaction-popup span { font-size: 1.5em; cursor: pointer; padding: 4px; border-radius: 8px; transition: transform 0.2s; }
        .reaction-popup span:hover { transform: scale(1.4); background: rgba(128,128,128,0.1); }

        @media (max-width: 700px) {
            .sidebar { position: fixed; left: 0; top: 50px; bottom: 0; z-index: 50; transform: translateX(-100%); width: 260px; }
            .sidebar.open { transform: translateX(0); }
            .msg { max-width: 85%; }
            .input-area { padding: 10px 12px; gap: 6px; }
            .input-area input { padding: 10px 14px; }
            .input-area button { padding: 10px 14px; font-size: 0.9em; }
        }
    </style>
</head>
<body>

<!-- ЛОГИН -->
<div id="loginScreen" class="login-screen">
    <div class="logo">💬</div>
    <h1>Чат для Своих</h1>
    <p class="subtitle">Придумай ник и выбери аватар</p>
    <div class="avatar-pick" id="avatarPick">
        <span onclick="pickAvatar(this,'😎')">😎</span><span onclick="pickAvatar(this,'🦊')">🦊</span>
        <span onclick="pickAvatar(this,'🐱')">🐱</span><span onclick="pickAvatar(this,'👽')">👽</span>
        <span onclick="pickAvatar(this,'🤖')">🤖</span><span onclick="pickAvatar(this,'👾')">👾</span>
        <span onclick="pickAvatar(this,'🐶')">🐶</span><span onclick="pickAvatar(this,'🦄')">🦄</span>
    </div>
    <input type="text" id="nameInput" placeholder="Твоё имя" autofocus maxlength="20" />
    <button onclick="login()">Войти в чат 🚀</button>
</div>

<!-- ОСНОВНОЙ ЭКРАН -->
<div id="app" class="app">
    <div class="topbar">
        <button onclick="toggleSidebar()" id="menuBtn">☰</button>
        <span class="room-title" id="roomTitle">💬 Общий чат</span>
        <button onclick="switchRoom('general')">Общий</button>
        <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>
    <div class="content">
        <div class="sidebar" id="sidebar">
            <h3>👥 В сети</h3>
            <ul class="user-list" id="userList"></ul>
            <div style="border-top:1px solid var(--border);margin-top:10px;padding-top:10px;">
                <div class="settings-row">⭐ <span id="myNameDisplay"></span></div>
            </div>
        </div>
        <div class="chat-area">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Фото">🖼️</button>
                <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(event)">
<button class="icon-btn" id="voiceBtn" onmousedown="startRecord()" onmouseup="stopRecord()" ontouchstart="startRecord()" ontouchend="stopRecord()" title="Голосовое">🎙️</button>
                <input type="text" id="msgInput" placeholder="Сообщение..." autocomplete="off" maxlength="500" />
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>
</div>

<!-- Попап реакций -->
<div class="reaction-popup" id="reactionPopup">
    <span onclick="addReaction('👍')">👍</span><span onclick="addReaction('❤️')">❤️</span>
    <span onclick="addReaction('😂')">😂</span><span onclick="addReaction('🔥')">🔥</span>
    <span onclick="addReaction('😮')">😮</span><span onclick="addReaction('😢')">😢</span>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    // =========== НАСТРОЙКИ ===========
    const SERVER_URL = "";
    // ================================

    let socket, myName = '', myAvatar = '😎';
    let currentRoom = 'general';
    let currentMsgId = null;
    let mediaRecorder, audioChunks = [];
    let isDark = false;

    // =========== ТЕМА ===========
    function toggleTheme() {
        isDark = !isDark;
        document.body.classList.toggle('dark', isDark);
        document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
        document.querySelector('meta[name="theme-color"]').content = isDark ? '#0a0a1a' : '#ffffff';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
    if (localStorage.getItem('theme') === 'dark') { isDark = true; document.body.classList.add('dark'); document.getElementById('themeBtn').textContent = '☀️'; }

    // =========== САЙДБАР ===========
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    // =========== АВАТАР ===========
    window.pickAvatar = function(el, avatar) {
        document.querySelectorAll('#avatarPick span').forEach(s => s.classList.remove('selected'));
        el.classList.add('selected');
        myAvatar = avatar;
    };

    // =========== ЛОГИН ===========
    window.login = function() {
        myName = document.getElementById('nameInput').value.trim();
        if (!myName) return;
        localStorage.setItem('chat_name', myName);
        localStorage.setItem('chat_avatar', myAvatar);
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('app').classList.add('active');
        document.getElementById('myNameDisplay').textContent = myName;
        connect();
    };

    // =========== ПОДКЛЮЧЕНИЕ ===========
    function connect() {
        socket = io(SERVER_URL);
        socket.on('connect', () => {
            socket.emit('user join', { name: myName, avatar: myAvatar });
        });
        socket.on('chat history', history => {
            document.getElementById('messages').innerHTML = '';
            history.forEach(addMessage);
            scrollDown();
        });
        socket.on('chat message', msg => {
            if (msg.room === currentRoom) {
                addMessage(msg);
                scrollDown();
            }
        });
        socket.on('users online', users => {
            const list = document.getElementById('userList');
            list.innerHTML = '';
            users.forEach(u => {
                if (u.name === myName) return;
                const li = document.createElement('li');
                li.innerHTML = `<span class="avatar">${u.avatar}</span>${escapeHtml(u.name)}<span class="online-dot"></span>`;
                li.onclick = () => switchRoom(u.name);
                if (currentRoom === u.name) li.classList.add('active');
                list.appendChild(li);
            });
        });
        socket.on('reaction update', data => {
            const msgEl = document.getElementById('msg-' + data.msgId);
            if (msgEl) updateReactions(msgEl, data.reactions);
        });

        document.getElementById('msgInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') sendMessage();
        });
    }

    // =========== КОМНАТЫ ===========
    window.switchRoom = function(room) {
        currentRoom = room;
        document.getElementById('roomTitle').textContent = room === 'general' ? '💬 Общий чат' : '💬 Личка: ' + room;
        document.getElementById('messages').innerHTML = '';
        socket.emit('join room', room);
        document.querySelectorAll('.user-list li').forEach(li => li.classList.remove('active'));
        if (room !== 'general') {
            const items = document.querySelectorAll('.user-list li');
            items.forEach(li => { if (li.textContent.includes(room)) li.classList.add('active'); });
        }
        if (window.innerWidth < 700) document.getElementById('sidebar').classList.remove('open');
    };

    // =========== ОТПРАВКА ===========
    window.sendMessage = function() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text || !socket) return;
        const payload = { text, room: currentRoom };
        if (currentRoom !== 'general') payload.to = currentRoom;
        socket.emit('chat message', payload);
        input.value = '';
    };

    // =========== ГОЛОСОВЫЕ ===========
    window.startRecord = function() {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onload = () => {
                    socket.emit('chat message', { text: '🎙️ Голосовое', voice: reader.result, room: currentRoom });
                };
                reader.readAsDataURL(blob);
                stream.getTracks().forEach(t => t.stop());
            };
            mediaRecorder.start();
            document.getElementById('voiceBtn').textContent = '🔴';
        }).catch(() => alert('Нет доступа к микрофону'));
    };
    window.stopRecord = function() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
            document.getElementById('voiceBtn').textContent = '🎙️';
        }
    };

    // =========== КАРТИНКИ ===========
    window.handleImage = function(e) {
        const file = e.target.files[0];
        if (!file || !socket) return;
        const reader = new FileReader();
        reader.onload = () => socket.emit('chat message', { text: '', image: reader.result, room: currentRoom });
        reader.readAsDataURL(file);
        e.target.value = '';
    };

    // =========== СООБЩЕНИЯ ===========
    function addMessage(msg) {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.classList.add('msg');
        div.id = 'msg-' + (msg.id || '');
        if (msg.type === 'system') {
            div.classList.add('system');
            div.textContent = msg.text;
        } else {
            const isMine = msg.user === myName;
            div.classList.add(isMine ? 'mine' : 'friend');
            let inner = `<div class="msg-header"><span>${msg.avatar} ${escapeHtml(msg.user)}</span><span class="msg-time">${msg.time}</span></div>`;
            if (msg.type === 'image') inner += `<img src="${msg.image}" loading="lazy" onclick="window.open(this.src)">`;
            else if (msg.type === 'voice') inner += `<audio controls src="${msg.voice}"></audio>`;
            else inner += `<div>${escapeHtml(msg.text)}</div>`;
            inner += `<div class="reactions" id="rx-${msg.id || ''}"></div>`;
            div.innerHTML = inner;

            // Долгое нажатие = реакции
            let pressTimer;
            div.addEventListener('touchstart', e => { pressTimer = setTimeout(() => showReactions(e, msg.id), 600); });
            div.addEventListener('touchend', () => clearTimeout(pressTimer));
            div.addEventListener('mousedown', e => { pressTimer = setTimeout(() => showReactions(e, msg.id), 600); });
            div.addEventListener('mouseup', () => clearTimeout(pressTimer));

            if (msg.reactions) updateReactions(div, msg.reactions);
        }
        container.appendChild(div);
    }

    function updateReactions(el, reactions) {
        const rxDiv = el.querySelector('.reactions') || el;
        if (!rxDiv) return;
        rxDiv.innerHTML = '';
        if (!reactions) return;
        Object.entries(reactions).forEach(([emoji, users]) => {
            const span = document.createElement('span');
            span.className = 'reaction';
            if (users.includes(myName)) span.classList.add('active');
            span.textContent = emoji + ' ' + users.length;
            span.onclick = () => {
                const msgId = el.id.replace('msg-', '');
                socket.emit('reaction', { msgId, emoji, room: currentRoom });
            };
            rxDiv.appendChild(span);
        });
    }

    function showReactions(e, msgId) {
        currentMsgId = msgId;
        const popup = document.getElementById('reactionPopup');
        popup.style.top = (e.clientY || e.touches[0].clientY) - 50 + 'px';
        popup.style.left = (e.clientX || e.touches[0].clientX) - 60 + 'px';
        popup.classList.add('show');
        setTimeout(() => popup.classList.remove('show'), 4000);
    }

    window.addReaction = function(emoji) {
        if (currentMsgId) {
            socket.emit('reaction', { msgId: currentMsgId, emoji, room: currentRoom });
            document.getElementById('reactionPopup').classList.remove('show');
        }
    };

    // =========== ХЕЛПЕРЫ ===========
    function scrollDown() {
        const m = document.getElementById('messages');
        setTimeout(() => { m.scrollTop = m.scrollHeight; }, 50);
    }
    function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    // Автозаполнение
    const savedName = localStorage.getItem('chat_name');
    const savedAvatar = localStorage.getItem('chat_avatar');
    if (savedName) document.getElementById('nameInput').value = savedName;
    if (savedAvatar) {
        myAvatar = savedAvatar;
        document.querySelectorAll('#avatarPick span').forEach(s => {
            if (s.textContent === savedAvatar) s.classList.add('selected');
        });
    } else {
        document.querySelector('#avatarPick span').classList.add('selected');
    }

    // Закрытие попапа реакций
    document.addEventListener('click', e => {
        if (!e.target.closest('.reaction-popup') && !e.target.closest('.msg')) {
            document.getElementById('reactionPopup').classList.remove('show');
        }
    });
</script>
</body>
</html>
