<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Чат для Своих</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg: #0a0a1a;
            --sidebar: #0f0f24;
            --chat-bg: #0d0d20;
            --accent: #e94560;
            --accent2: #00d4ff;
            --text: #e8e8f0;
            --text-secondary: #8888aa;
            --border: rgba(255,255,255,0.06);
            --glass: rgba(255,255,255,0.03);
            --input-bg: rgba(255,255,255,0.04);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh; height: 100dvh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(233,69,96,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(0,212,255,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 80%, rgba(120,80,255,0.05) 0%, transparent 60%);
        }
        .login-screen {
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border); padding: 50px 40px;
            border-radius: 28px; text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }
        .login-screen .logo { font-size: 70px; margin-bottom: 15px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
        .login-screen h1 { font-size: 1.8em; font-weight: 700; margin-bottom: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .login-screen .subtitle { color: var(--text-secondary); font-size: 0.9em; margin-bottom: 25px; }
        .login-screen input {
            display: block; width: 100%; padding: 14px 20px; margin: 10px 0;
            border-radius: 30px; border: 1px solid var(--border);
            background: var(--input-bg); color: var(--text); font-size: 1em;
            text-align: center; outline: none; transition: all 0.3s;
        }
        .login-screen input:focus { border-color: var(--accent); box-shadow: 0 0 20px rgba(233,69,96,0.15); }
        .login-screen button {
            width: 100%; padding: 14px; margin-top: 12px;
            border-radius: 30px; border: none;
            background: linear-gradient(135deg, var(--accent), #c23152);
            color: white; font-weight: bold; font-size: 1.1em;
            cursor: pointer; transition: all 0.3s;
        }
        .login-screen button:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(233,69,96,0.3); }
        .login-screen .avatar-pick { display: flex; gap: 8px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
        .login-screen .avatar-pick span { font-size: 2em; cursor: pointer; transition: transform 0.2s; padding: 5px; border-radius: 50%; }
        .login-screen .avatar-pick span:hover { transform: scale(1.3); }
        .login-screen .avatar-pick span.selected { background: rgba(233,69,96,0.2); outline: 2px solid var(--accent); border-radius: 50%; }
        .app { display: none; width: 100%; height: 100%; max-width: 1200px; }
        .app.active { display: flex; }
        .sidebar {
            width: 280px; background: var(--sidebar); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 20px 15px; backdrop-filter: blur(10px);
        }
        .sidebar h3 { font-size: 0.75em; text-transform: uppercase; letter-spacing: 3px; color: var(--text-secondary); margin-bottom: 15px; }
        .user-list { list-style: none; flex-grow: 1; overflow-y: auto; }
        .user-list li {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 14px; margin-bottom: 4px;
            font-size: 0.95em; transition: background 0.2s; cursor: default;
            animation: fadeSlide 0.3s ease;
        }
        @keyframes fadeSlide { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .user-list li:hover { background: rgba(255,255,255,0.03); }
        .avatar { font-size: 1.4em; }
        .online-dot { width: 9px; height: 9px; border-radius: 50%; background: #00ff88; margin-left: auto; box-shadow: 0 0 10px #00ff88, 0 0 20px #00ff8866; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        .sidebar-footer { border-top: 1px solid var(--border); padding-top: 15px; font-size: 0.85em; color: var(--text-secondary); }
        .my-name { color: var(--text); font-weight: bold; }
        .chat-area { flex-grow: 1; display: flex; flex-direction: column; background: var(--chat-bg); position: relative; }
        .chat-header { padding: 18px 25px; border-bottom: 1px solid var(--border); font-weight: bold; font-size: 1.1em; display: flex; align-items: center; gap: 10px; backdrop-filter: blur(10px); background: rgba(13,13,32,0.8); }
        .messages { flex-grow: 1; overflow-y: auto; padding: 20px 25px; display: flex; flex-direction: column; gap: 4px; }
        .messages::-webkit-scrollbar { width: 5px; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .msg { max-width: 72%; padding: 10px 16px; border-radius: 20px; line-height: 1.5; font-size: 0.95em; word-wrap: break-word; animation: msgIn 0.3s ease; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(15px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .msg.mine { background: linear-gradient(135deg, #e94560, #c23152); align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 8px 25px rgba(233,69,96,0.2); }
        .msg.friend { background: rgba(255,255,255,0.04); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); backdrop-filter: blur(10px); }
        .msg.system { align-self: center; background: transparent; color: var(--text-secondary); font-size: 0.78em; padding: 5px 15px; max-width: 100%; text-align: center; }
        .msg-header { font-size: 0.72em; margin-bottom: 3px; display: flex; align-items: center; gap: 5px; opacity: 0.8; }
        .msg-time { font-size: 0.7em; opacity: 0.6; margin-left: 8px; }
        .msg img { max-width: 100%; max-height: 300px; border-radius: 12px; margin-top: 6px; cursor: pointer; }
        .typing-indicator { padding: 5px 25px; font-size: 0.8em; color: var(--accent2); font-style: italic; min-height: 24px; }
        .input-area {
            display: flex; padding: 15px 20px; border-top: 1px solid var(--border);
            background: rgba(15,15,36,0.8); backdrop-filter: blur(10px); gap: 8px; align-items: center;
        }
        .input-area input {
            flex-grow: 1; padding: 14px 20px; border-radius: 30px;
            border: 1px solid var(--border); background: var(--input-bg);
            color: var(--text); font-size: 1em; outline: none; transition: all 0.3s;
        }
        .input-area input:focus { border-color: var(--accent); box-shadow: 0 0 20px rgba(233,69,96,0.1); }
        .input-area button {
            padding: 14px 22px; border-radius: 30px; border: none;
            background: linear-gradient(135deg, var(--accent), #c23152);
            color: white; font-weight: bold; cursor: pointer;
            transition: all 0.3s; font-size: 1em; white-space: nowrap;
        }
        .input-area button:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(233,69,96,0.3); }
        .img-btn { padding: 14px 16px !important; font-size: 1.3em !important; background: var(--input-bg) !important; border: 1px solid var(--border) !important; }
        .img-btn:hover { border-color: var(--accent) !important; box-shadow: none !important; }
        @media (max-width: 750px) {
            .sidebar { display: none; }
            .msg { max-width: 88%; }
            .input-area { padding: 10px 15px; }
            .input-area input { padding: 12px 16px; }
        }
    </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <div class="logo">💬</div>
    <h1>Чат для Своих</h1>
    <p class="subtitle">Придумай ник и выбери аватар</p>
    <div class="avatar-pick" id="avatarPick">
        <span onclick="pickAvatar(this,'😎')">😎</span>
        <span onclick="pickAvatar(this,'🦊')">🦊</span>
        <span onclick="pickAvatar(this,'🐱')">🐱</span>
        <span onclick="pickAvatar(this,'👽')">👽</span>
        <span onclick="pickAvatar(this,'🤖')">🤖</span>
        <span onclick="pickAvatar(this,'👾')">👾</span>
        <span onclick="pickAvatar(this,'🐶')">🐶</span>
        <span onclick="pickAvatar(this,'🦄')">🦄</span>
    </div>
    <input type="text" id="nameInput" placeholder="Твоё имя" autofocus maxlength="20" />
    <button onclick="login()">Войти в чат 🚀</button>
</div>

<div id="app" class="app">
    <div class="sidebar">
        <h3>👥 В сети (<span id="onlineCount">0</span>)</h3>
        <ul class="user-list" id="userList"></ul>
        <div class="sidebar-footer"><span>⭐ </span><span class="my-name" id="myNameDisplay"></span></div>
    </div>
    <div class="chat-area">
        <div class="chat-header">💬 Общий чат</div>
        <div class="messages" id="messages"></div>
        <div class="typing-indicator" id="typingIndicator"></div>
        <div class="input-area">
            <button class="img-btn" onclick="document.getElementById('fileInput').click()" title="Отправить картинку">🖼️</button>
            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(event)">
            <input type="text" id="msgInput" placeholder="Сообщение..." autocomplete="off" maxlength="500" />
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const SERVER_URL = "";
    let socket, myName = '', myAvatar = '😎';
    let typingTimeout;
    const room = 'general';

    function playSound(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            if (type === 'msg') { o.frequency.value = 800; g.gain.value = 0.1; o.start(); o.stop(ctx.currentTime + 0.08); }
            if (type === 'join') { o.frequency.value = 600; g.gain.value = 0.08; o.start(); o.stop(ctx.currentTime + 0.15); }
            if (type === 'leave') { o.frequency.value = 300; g.gain.value = 0.08; o.start(); o.stop(ctx.currentTime + 0.2); }
        } catch(e) {}
    }

    window.pickAvatar = function(el, avatar) {
        document.querySelectorAll('#avatarPick span').forEach(s => s.classList.remove('selected'));
        el.classList.add('selected');
        myAvatar = avatar;
    };

    window.login = function() {
        myName = document.getElementById('nameInput').value.trim();
        if (!myName) return;
        localStorage.setItem('chat_name', myName);
        localStorage.setItem('chat_avatar', myAvatar);
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('app').classList.add('active');
        document.getElementById('myNameDisplay').textContent = myName;
        connect();
    };

    function connect() {
        socket = io(SERVER_URL);
        socket.on('connect', function() {
            socket.emit('user join', { name: myName, avatar: myAvatar, room: room });
        });
        socket.on('chat history', function(history) {
            document.getElementById('messages').innerHTML = '';
            history.forEach(addMessage);
            scrollDown();
        });
        socket.on('chat message', function(msg) {
            addMessage(msg);
            scrollDown();
            if (msg.type === 'message' || msg.type === 'image') {
                if (msg.user !== myName) playSound('msg');
            } else if (msg.text && msg.text.includes('вошёл')) playSound('join');
            else if (msg.text && msg.text.includes('вышел')) playSound('leave');
        });
        socket.on('users online', function(users) {
            document.getElementById('onlineCount').textContent = users.length;
            var list = document.getElementById('userList');
            list.innerHTML = '';
            users.forEach(function(u) {
                var li = document.createElement('li');
                li.innerHTML = '<span class="avatar">' + u.avatar + '</span>' + escapeHtml(u.name) + '<span class="online-dot"></span>';
                list.appendChild(li);
            });
        });
        socket.on('typing', function(name) {
            document.getElementById('typingIndicator').textContent = name + ' печатает...';
        });
        socket.on('stop typing', function() {
            document.getElementById('typingIndicator').textContent = '';
        });
        var input = document.getElementById('msgInput');
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendMessage();
            else {
                socket.emit('typing');
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(function() { socket.emit('stop typing'); }, 1500);
            }
        });
    }

    window.sendMessage = function() {
        var input = document.getElementById('msgInput');
        var text = input.value.trim();
        if (!text || !socket) return;
        socket.emit('chat message', { text: text, room: room });
        input.value = '';
        socket.emit('stop typing');
    };

    function addMessage(msg) {
        var container = document.getElementById('messages');
        var div = document.createElement('div');
        div.classList.add('msg');
        if (msg.type === 'system') {
            div.classList.add('system');
            div.textContent = msg.text;
        } else if (msg.type === 'image') {
            var isMine = msg.user === myName;
            div.classList.add(isMine ? 'mine' : 'friend');
            div.innerHTML = '<div class="msg-header"><span>' + msg.avatar + ' ' + escapeHtml(msg.user) + '</span><span class="msg-time">' + msg.time + '</span></div><img src="' + msg.image + '" alt="картинка" loading="lazy" onclick="window.open(this.src)"><br><span>' + escapeHtml(msg.text||'') + '</span>';
        } else {
            var isMine = msg.user === myName;
            div.classList.add(isMine ? 'mine' : 'friend');
            div.innerHTML = '<div class="msg-header"><span>' + msg.avatar + ' ' + escapeHtml(msg.user) + '</span><span class="msg-time">' + msg.time + '</span></div><div>' + escapeHtml(msg.text) + '</div>';
        }
        container.appendChild(div);
    }

    window.handleImage = function(e) {
        var file = e.target.files[0];
        if (!file || !socket) return;
        var reader = new FileReader();
        reader.onload = function() {
            socket.emit('chat message', { text: '', image: reader.result, room: room });
        };
        reader.readAsDataURL(file);
        e.target.value = '';
    };

    function scrollDown() {
        var m = document.getElementById('messages');
        setTimeout(function() { m.scrollTop = m.scrollHeight; }, 50);
    }

    function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    // Автозаполнение
    var savedName = localStorage.getItem('chat_name');
    var savedAvatar = localStorage.getItem('chat_avatar');
    if (savedName) document.getElementById('nameInput').value = savedName;
    if (savedAvatar) {
        myAvatar = savedAvatar;
        document.querySelectorAll('#avatarPick span').forEach(function(s) {
            if (s.textContent === savedAvatar) s.classList.add('selected');
            else s.classList.remove('selected');
        });
    }
    if (!savedAvatar) {
        document.querySelector('#avatarPick span').classList.add('selected');
    }
</script>
</body>
</html>
