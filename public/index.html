<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Чат для Своих</title>
    <style>
        :root {
            --bg: #0f0f23;
            --sidebar: #1a1a2e;
            --chat-bg: #16213e;
            --msg-mine: #533483;
            --msg-friend: #1a1a2e;
            --accent: #e94560;
            --text: #eee;
            --text-secondary: #aaa;
            --border: #2a2a4a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* ЭКРАН ВХОДА */
        .login-screen {
            background: var(--sidebar);
            padding: 40px 50px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }
        .login-screen h1 { font-size: 2em; margin-bottom: 25px; }
        .login-screen .logo { font-size: 60px; margin-bottom: 10px; }
        .login-screen input {
            display: block; width: 100%; padding: 14px 20px;
            margin: 12px 0; border-radius: 30px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-size: 1em;
            text-align: center; outline: none; transition: border 0.3s;
        }
        .login-screen input:focus { border-color: var(--accent); }
        .login-screen button {
            width: 100%; padding: 14px; margin-top: 10px;
            border-radius: 30px; border: none; background: var(--accent);
            color: white; font-weight: bold; font-size: 1.1em;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        .login-screen button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(233, 69, 96, 0.4);
        }

        /* ОСНОВНОЙ ЭКРАН */
        .app { display: none; width: 100%; height: 100vh; max-width: 1100px; }
        .app.active { display: flex; }

        /* БОКОВАЯ ПАНЕЛЬ */
        .sidebar {
            width: 260px; background: var(--sidebar); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 20px 15px;
        }
        .sidebar h3 {
            font-size: 0.8em; text-transform: uppercase; letter-spacing: 2px;
            color: var(--text-secondary); margin-bottom: 15px;
        }
        .user-list { list-style: none; flex-grow: 1; overflow-y: auto; }
        .user-list li {
            display: flex; align-items: center; gap: 10px;
            padding: 10px; border-radius: 12px; margin-bottom: 4px;
            font-size: 0.95em; transition: background 0.2s; cursor: default;
        }
        .user-list li:hover { background: rgba(255,255,255,0.03); }
        .avatar { font-size: 1.5em; }
        .online-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #4ade80; margin-left: auto; box-shadow: 0 0 8px #4ade80;
        }
        .sidebar-footer {
            border-top: 1px solid var(--border); padding-top: 15px;
            font-size: 0.85em; color: var(--text-secondary);
        }
        .my-name { color: var(--text); font-weight: bold; }

        /* ОКНО ЧАТА */
        .chat-area {
            flex-grow: 1; display: flex; flex-direction: column;
            background: var(--chat-bg);
        }
        .chat-header {
            padding: 18px 25px; border-bottom: 1px solid var(--border);
            font-weight: bold; font-size: 1.1em; display: flex;
            align-items: center; gap: 10px;
        }
        .messages {
            flex-grow: 1; overflow-y: auto; padding: 20px 25px;
            display: flex; flex-direction: column; gap: 6px;
        }
        .
        ::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        /* СООБЩЕНИЯ */
        .msg {
            max-width: 75%; padding: 10px 16px; border-radius: 18px;
            line-height: 1.5; font-size: 0.95em; word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg.mine { background: var(--msg-mine); align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.friend { background: var(--msg-friend); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }
        .msg.system {
            align-self: center; background: transparent; color: var(--text-secondary);
            font-size: 0.8em; padding: 5px; max-width: 100%; text-align: center;
        }
        .msg-header { font-size: 0.75em; margin-bottom: 3px; display: flex; align-items: center; gap: 5px; }
        .msg-time { font-size: 0.7em; opacity: 0.7; margin-left: 8px; }

        /* ПОЛЕ ВВОДА */
        .input-area {
            display: flex; padding: 15px 25px; border-top: 1px solid var(--border);
            background: var(--sidebar); gap: 10px;
        }
        .input-area input {
            flex-grow: 1; padding: 14px 20px; border-radius: 30px;
            border: 1px solid var(--border); background: var(--bg);
            color: var(--text); font-size: 1em; outline: none;
            transition: border 0.3s;
        }
        .input-area input:focus { border-color: var(--accent); }
        .input-area button {
            padding: 14px 28px; border-radius: 30px; border: none;
            background: var(--accent); color: white; font-weight: bold;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            font-size: 1em;
        }
        .input-area button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.3);
        }

        /* АДАПТИВ для телефонов */
        @media (max-width: 700px) {
            .sidebar { display: none; }
            .msg { max-width: 90%; }
        }
    </style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="loginScreen" class="login-screen">
    <div class="logo">💬</div>
    <h1>Чат для Своих</h1>
    <input type="text" id="nameInput" placeholder="Твоё имя" autofocus maxlength="20" />
    <button onclick="login()">Войти в чат 🚀</button>
</div>

<!-- ОСНОВНОЙ ЭКРАН -->
<div id="app" class="app">
    <div class="sidebar">
        <h3>👥 В сети (<span id="onlineCount">0</span>)</h3>
        <ul class="user-list" id="userList"></ul>
        <div class="sidebar-footer">
            <span class="my-name" id="myNameDisplay"></span>
        </div>
    </div>
    <div class="chat-area">
        <div class="chat-header">💬 Общий чат</div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Сообщение..." autocomplete="off" maxlength="500" />
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    // ============ НАСТРОЙКИ ============
    const SERVER_URL = "http://localhost:3000";
    // ===================================

    let socket;
    let myName = '';
    const sound = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACAf39/f4B/f3+Af39/gH9/f4B/f3+Af39/gH9/f4B/f3+Af39/gH9/f4B/f3+Af39/gH9/f4B/f3+Af39/gH9/f4B/f3+Af39/gH9/f4B/f3+Af39/gH9/f4B/f38AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//w==');

    // Вход
function login() {
        myName = document.getElementById('nameInput').value.trim();
        if (!myName) return;

        localStorage.setItem('chat_name', myName);

        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('app').classList.add('active');
        document.getElementById('myNameDisplay').textContent = '⭐ ' + myName;

        connect();
    }

    // Подключение к серверу
    function connect() {
        socket = io(SERVER_URL);

        socket.on('connect', () => {
            socket.emit('user join', { name: myName, avatar: '😎' });
        });

        socket.on('chat history', (history) => {
            document.getElementById('messages').innerHTML = '';
            history.forEach(m => addMessage(m));
            scrollDown();
        });

        socket.on('chat message', (msg) => {
            addMessage(msg);
            scrollDown();
            if (msg.type === 'message' && msg.user !== myName) {
                sound.currentTime = 0;
                sound.play().catch(() => {});
            }
        });

        socket.on('users online', (users) => {
            document.getElementById('onlineCount').textContent = users.length;
            const list = document.getElementById('userList');
            list.innerHTML = '';
            users.forEach(u => {
                const li = document.createElement('li');
                li.innerHTML = `<span class="avatar">${escapeHtml(u.avatar || '😎')}</span>${escapeHtml(u.name)}<span class="online-dot"></span>`;
                list.appendChild(li);
            });
        });

        // Enter для отправки
        document.getElementById('msgInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    }

    // Отправка
    function sendMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text || !socket) return;

        socket.emit('chat message', {
            user: myName,
            avatar: '😎',
            text: text
        });
        input.value = '';
    }

    // Добавить сообщение на экран
    function addMessage(msg) {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.classList.add('msg');

        if (msg.type === 'system') {
            div.classList.add('system');
            div.textContent = msg.text;
        } else {
            const isMine = msg.user === myName;
            div.classList.add(isMine ? 'mine' : 'friend');
            div.innerHTML = `
                <div class="msg-header">
                    <span>${escapeHtml(msg.avatar || '')} ${escapeHtml(msg.user)}</span>
                    <span class="msg-time">${msg.time || ''}</span>
                </div>
                <div>${escapeHtml(msg.text)}</div>
            `;
        }

        container.appendChild(div);
    }

    function scrollDown() {
        const m = document.getElementById('messages');
        setTimeout(() => { m.scrollTop = m.scrollHeight; }, 50);
    }

    function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    // Автовход
    const saved = localStorage.getItem('chat_name');
    if (saved) {
        document.getElementById('nameInput').value = saved;
    }
</script>
</body>
</html>
